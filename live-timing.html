<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Timing</title>
  <style>
    :root {
      --bg:     #0d0d0d;
      --bg2:    #0a0a0a;
      --border: #232323;
      --text:   #c0c0c0;
      --dim:    #505050;
      --faint:  #2a2a2a;
      --green:  #4ade80;
      --purple: #9747ff;
      --yellow: #e0b800;
      --red:    #e03030;
      --orange: #e08030;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      zoom: 1.2;
    }

    /* ── Session bar ── */
    #session-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 34px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }
    #conn-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--faint);
      transition: background 0.3s;
    }
    #conn-dot.connected  { background: var(--green); }
    #conn-dot.connecting { background: var(--yellow); animation: pulse 1s infinite; }
    #conn-dot.error      { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    #session-event {
      font-weight: 600;
      font-size: 12px;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    #track-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #track-badge.s-clear  { background:#0d2010; color:var(--green); }
    #track-badge.s-yellow { background:#241d00; color:var(--yellow); }
    #track-badge.s-red    { background:#240000; color:var(--red); }
    #track-badge.s-sc     { background:#241000; color:var(--orange); }
    #track-badge.s-vsc    { background:#1a1000; color:var(--orange); }
    #session-type {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #session-clock {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #lap-info {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }

    /* ── Timing tower ── */
    #tower-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }
    #table-scroll { /* plain wrapper, no overflow */ }
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #0f0f0f;
      z-index: 2;
      color: var(--dim);
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: right;
      user-select: none;
    }
    thead th.l { text-align: left; }

    tbody tr { border-bottom: 1px solid #181818; background: #1b1b1b; }
    tbody tr:hover { background: #131313; }
    tbody tr.row-retired { opacity: 0.35; }

    td {
      padding: 6px 6px;
      white-space: nowrap;
      text-align: right;
      vertical-align: middle;
      color: var(--text);
      font-size: 11px;
    }
    td.l { text-align: left; }

    thead th:first-child, tbody td:first-child { padding-left: 16px; }
    thead th:last-child,  tbody td:last-child  { padding-right: 16px; }

    /* Position */
    .pos-cell { color: var(--dim); width: 22px; text-align: center; }

    /* Driver */
    .drv-cell { display: flex; align-items: center; gap: 5px; }
    .drv-logo-bg {
      width: 20px; height: 20px;
      border-radius: 4px;
      background: #1b1b1b;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drv-logo { width: 20px; height: 20px; object-fit: contain; }
    .drv-tla  {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: #d8d8d8;
    }
    .drv-flag { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; object-fit: cover; outline: 0.6px solid #ffffff; }

    /* Status */
    .status-col { width: 68px; text-align: center; }
    .status-badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: -0.03em;
      padding: 2px 5px;
      border-radius: 2px;
      white-space: nowrap;
    }
    .status-pit { color: #bebebe; border: 0.4px solid rgba(190,190,190,0.5); background: rgba(190,190,190,0.07); }
    .status-out { color: var(--green); border: 0.4px solid rgba(46,201,46,0.5); background: rgba(46,201,46,0.07); }
    .status-dnf { color: var(--red);   border: 0.4px solid rgba(224,48,48,0.5); background: rgba(224,48,48,0.07); }

    /* Tyre */
    .tyre-cell { width: 52px; text-align: center; }
    .tyre-wrap { display: flex; align-items: center; gap: 4px; justify-content: center; }
    .tyre-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .tyre-age  { font-size: 10px; font-weight: 600; color: #d2d2d2; }

    /* Gap / Interval */
    .gap-cell { min-width: 54px; font-weight: 600; color: var(--dim); }
    .int-cell { min-width: 50px; font-weight: 600; color: var(--dim); }
    .int-cell.catching { color: var(--green); }

    /* Sectors */
    .sec-cell { min-width: 64px; padding: 0; }
    .sec-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 6px 6px 12px;
    }
    .sec-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--faint);
    }
    .sec-bar.c-yellow { background: var(--yellow); }
    .sec-bar.c-green  { background: var(--green); }
    .sec-bar.c-purple { background: var(--purple); }
    .sec-times {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sec-mini { font-size: 8px; font-weight: 500; color: #c0c0c0; }
    .sec-val  { font-size: 10px; font-weight: 500; color: var(--dim); }
    .sec-val.c-yellow { color: var(--yellow); }
    .sec-val.c-green  { color: var(--green); }
    .sec-val.c-purple { color: var(--purple); }

    /* Lap times */
    .lap-cell  { min-width: 66px; font-weight: 600; }
    .best-cell { min-width: 66px; font-weight: 600; color: var(--dim); }
    .best-mini { display: none; }

    .c-yellow { color: var(--yellow) !important; }
    .c-green  { color: var(--green)  !important; }
    .c-purple { color: var(--purple) !important; }
    .c-dim    { color: var(--dim)    !important; }

    /* ── Elimination zone ── */
    tbody tr.row-elim { background: #2c0b0d !important; }
    tbody tr.row-elim:hover { background: #3a1012 !important; }
    tr.elim-divider td {
      background: #4a1313;
      padding: 8px 14px 6px;
      border-bottom: 0.8px solid #181818;
    }
    .elim-divider-inner {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .elim-chevron { opacity: 0.65; flex-shrink: 0; }
    .elim-label {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .elim-sep { color: rgba(255,255,255,0.4); font-size: 11px; }
    .elim-session {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* ── Race Control ── */
    #rcm-wrap {
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    #rcm-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }
    #rcm-head:hover { color: var(--text); }
    #rcm-toggle { margin-left: auto; font-size: 10px; }
    #rcm-translate-btn {
      background: none;
      border: 0.8px solid var(--dim);
      color: var(--dim);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 1px 5px;
      border-radius: 2px;
      cursor: pointer;
      margin-left: 6px;
      text-transform: uppercase;
    }
    #rcm-translate-btn:hover { color: var(--text); border-color: var(--text); }
    #rcm-translate-btn.active { color: var(--yellow); border-color: var(--yellow); }
    #rcm-list {
      display: flex;
      flex-direction: column;
    }
    #rcm-list::-webkit-scrollbar { width: 3px; }
    #rcm-list::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
    #rcm-list::-webkit-scrollbar-track { background: transparent; }
    .rcm-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 16px 8px 12px;
      border-bottom: 1px solid #141414;
    }
    .rcm-icon { width: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding-top: 1px; }
    .rcm-badge { font-size: 7px; font-weight: 700; letter-spacing: 0; border: 0.8px solid; border-radius: 2px; padding: 1px 2px; line-height: 1; }
    .rcm-ts  { color: #383838; font-size: 10px; flex-shrink: 0; min-width: 34px; padding-top: 1px; }
    .rcm-msg { flex: 1; color: #9a9a9a; font-size: 11px; line-height: 1.3; }
    .rcm-row.flag-YELLOW       .rcm-msg { color: var(--yellow); }
    .rcm-row.flag-DOUBLE-YELLOW .rcm-msg { color: var(--yellow); }
    .rcm-row.flag-RED          .rcm-msg { color: var(--red); }
    .rcm-row.flag-GREEN        .rcm-msg { color: var(--green); }
    .rcm-row.flag-CLEAR        .rcm-msg { color: var(--green); }
    .rcm-row.flag-SC           .rcm-msg { color: var(--orange); }
    .rcm-row.flag-VSC          .rcm-msg { color: var(--orange); }
    .rcm-row.flag-BLUE         .rcm-msg { color: #5090f0; }
    #rcm-wrap.collapsed #rcm-list { display: none; }

    /* ── Status bar ── */
    #status-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 22px;
      background: #110000;
      border-top: 1px solid #200000;
      font-size: 10px;
      color: #904040;
    }
    #status-bar.hidden { display: none; }

    /* ── Preloader ── */
    #preloader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      z-index: 50;
    }
    #preloader.hidden { display: none; }
    .pl-dots { display: flex; gap: 8px; align-items: center; }
    .pl-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--dim);
      animation: dot-bounce 1.4s infinite ease-in-out both;
    }
    .pl-dots span:nth-child(1) { animation-delay: -0.32s; }
    .pl-dots span:nth-child(2) { animation-delay: -0.16s; }
    .pl-dots span:nth-child(3) { animation-delay:     0s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40%           { transform: scale(1); opacity: 0.8; }
    }
    #pl-sub { font-size: 11px; color: var(--dim); }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      #app { zoom: 1; }
      .drv-flag { display: none; }
      td { padding: 4px 2px; }
      thead th { padding: 4px 2px; }
      thead th:first-child, tbody td:first-child { padding-left: 8px; }
      thead th:last-child,  tbody td:last-child  { padding-right: 12px; }
      .lap-cell, .col-lap { padding-right: 12px; }
      .sec-mini { display: none; }
      .sec-cell { min-width: 44px; }
      .col-best { display: none; }
      .best-mini { display: block; font-size: 9px; opacity: 0.8; }
      #table-scroll { overflow-x: auto; }
      table { width: max-content; min-width: 100%; }
    }
    @media (max-width: 400px) {
      .col-int, .col-status { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <div id="session-bar">
    <span id="conn-dot" class="connecting"></span>
    <span id="session-event">—</span>
    <span id="track-badge" class="s-clear">CLEAR</span>
    <span id="session-type"></span>
    <span id="session-clock"></span>
    <span id="lap-info"></span>
  </div>

  <div id="tower-wrap">
    <div id="table-scroll">
    <table>
      <thead>
        <tr>
          <th class="l">P</th>
          <th class="l">Водитель</th>
          <th class="col-status">Состояние</th>
          <th class="col-tyre">Резина</th>
          <th>Гэп</th>
          <th class="col-int">Инт</th>
          <th class="col-s1">S1</th>
          <th class="col-s2">S2</th>
          <th class="col-s3">S3</th>
          <th class="col-lap">Круг</th>
          <th class="col-best">Лучший</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    </div>

    <div id="rcm-wrap">
      <div id="rcm-head">
        <span>Race Control</span>
        <button id="rcm-translate-btn" title="Перевести на русский">RU</button>
        <span id="rcm-toggle">▾</span>
      </div>
      <div id="rcm-list"></div>
    </div>
  </div>

  <div id="status-bar" class="hidden"></div>

  <div id="preloader">
    <div class="pl-dots"><span></span><span></span><span></span></div>
    <span id="pl-sub">Подключение к F1 Live Timing…</span>
  </div>

</div>
<script>
'use strict';

const TOPICS = [
  'TimingData', 'DriverList', 'TimingAppData',
  'TrackStatus', 'LapCount', 'SessionInfo',
  'RaceControlMessages', 'ExtrapolatedClock',
];

const DRIVER_COUNTRY = {
  ALB: 'Thailand',       ALO: 'Spain',          ANT: 'Italy',
  BEA: 'United Kingdom', BOR: 'Brazil',         BOT: 'Finland',
  COL: 'Argentina',      GAS: 'France',         HAD: 'France',
  HAM: 'United Kingdom', HUL: 'Germany',        LAW: 'New Zealand',
  LEC: 'Monaco',         LIN: 'United Kingdom', NOR: 'United Kingdom',
  OCO: 'France',         PER: 'Mexico',         PIA: 'Australia',
  RUS: 'United Kingdom', SAI: 'Spain',          STR: 'Canada',
  VER: 'Netherlands',
};

const S = {
  drivers:   {},
  timing:    {},
  appTiming: {},
  session:   {},
  track:     { Status: '1', Message: 'AllClear' },
  lap:       {},
  rcm:       [],
};
const tyreCache = {}; // num → last known non-null Compound
const intCache  = {}; // num → previous interval float (for catching detection)
let clockData   = null; // { remaining: secs, utcMs: ms, extrapolating: bool }

function merge(tgt, src) {
  if (src === null || typeof src !== 'object' || Array.isArray(src)) return src;
  const out = Object.assign({}, tgt);
  for (const k of Object.keys(src)) {
    const sv = src[k], tv = out[k];
    if (sv !== null && typeof sv === 'object' && !Array.isArray(sv) &&
        tv !== null && typeof tv === 'object' && !Array.isArray(tv)) {
      out[k] = merge(tv, sv);
    } else {
      out[k] = sv;
    }
  }
  return out;
}

let ws = null, keepAlive = null, reconnTimer = null;
let hasData = false, noSessionTimer = null, msgCount = 0;

function parseRemaining(str) {
  if (!str) return null;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return null;
}

function formatTime(secs) {
  if (secs == null || secs < 0) secs = 0;
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function renderClock() {
  const el = document.getElementById('session-clock');
  if (!el || !clockData) { if (el) el.textContent = ''; return; }
  let secs = clockData.remaining;
  if (clockData.extrapolating) {
    const elapsed = (Date.now() - clockData.utcMs) / 1000;
    secs = Math.max(0, clockData.remaining - elapsed);
  }
  el.textContent = formatTime(Math.round(secs));
}

async function connect() {
  setDot('connecting');
  clearTimeout(reconnTimer);
  clearStatus();
  if (ws) { try { ws.close(); } catch(_) {} ws = null; }
  if (!hasData) setPreloaderText('Подключение…');

  try {
    ws = new WebSocket('wss://updating-ambien-reprint-each.trycloudflare.com');
  } catch(e) {
    setDot('error');
    if (!hasData) setPreloaderText('Ошибка: ' + e.message);
    showStatus('Ошибка WebSocket · ' + e.message + ' · повтор через 2 с');
    reconnTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setDot('connected');
    clearStatus();
    if (!hasData) {
      setPreloaderText('Ожидание данных сессии…');
      noSessionTimer = setTimeout(() => {
        if (!hasData) {
          setPreloaderText(msgCount === 0
            ? 'Нет данных от F1 · сессии нет или проблема с relay'
            : `Данные получены, но не распознаны · ${msgCount} сообщений`);
        }
      }, 20000);
    }
    keepAlive = setInterval(() => ws.readyState === 1 && ws.send('{}'), 20000);
  };

  ws.onmessage = e => { msgCount++; try { handleMsg(JSON.parse(e.data)); } catch(_) {} };

  ws.onclose = e => {
    clearInterval(keepAlive);
    setDot('error');
    const detail = e.reason ? `${e.code} · ${e.reason}` : `код ${e.code}`;
    showStatus(`Соединение разорвано · ${detail} · повтор через 2 с`);
    if (!hasData) setPreloaderText('Соединение разорвано · повтор…');
    reconnTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => {};
}

function handleMsg(msg) {
  if (msg.__dbg) { if (!hasData) setPreloaderText(msg.__dbg); return; }
  if (msg.R && typeof msg.R === 'object')
    for (const [topic, data] of Object.entries(msg.R)) applyFeed(topic, data);
  if (Array.isArray(msg.M))
    for (const item of msg.M)
      if (item.M === 'feed' && Array.isArray(item.A) && item.A.length >= 2)
        applyFeed(item.A[0], item.A[1]);
  if (msg.E) {
    showStatus('Ошибка SignalR · ' + msg.E);
    if (!hasData) setPreloaderText('Ошибка SignalR · ' + msg.E);
  }
}

function applyFeed(topic, data) {
  if (!data) return;
  switch (topic) {
    case 'DriverList':
      S.drivers = merge(S.drivers, data);
      if (Object.keys(S.drivers).length) { hasData = true; clearTimeout(noSessionTimer); hidePreloader(); clearStatus(); }
      renderTower(); break;
    case 'TimingData':
      if (data.Lines) S.timing = merge(S.timing, data.Lines);
      if (Object.keys(S.timing).length) { hasData = true; clearTimeout(noSessionTimer); hidePreloader(); clearStatus(); }
      renderTower(); break;
    case 'TimingAppData':
      if (data.Lines) S.appTiming = merge(S.appTiming, data.Lines);
      renderTower(); break;
    case 'TrackStatus':  S.track = Object.assign({}, S.track, data); renderHeader(); break;
    case 'LapCount':     S.lap   = Object.assign({}, S.lap,   data); renderHeader(); break;
    case 'SessionInfo':  S.session = merge(S.session, data);         renderHeader(); break;
    case 'ExtrapolatedClock': {
      const rem = parseRemaining(data.Remaining);
      if (rem != null) {
        clockData = {
          remaining:    rem,
          utcMs:        data.Utc ? new Date(data.Utc).getTime() : Date.now(),
          extrapolating: !!data.Extrapolating,
        };
        renderClock();
      }
      break;
    }
    case 'RaceControlMessages':
      if (data.Messages) {
        const msgs = Object.values(data.Messages).sort((a,b) => (a.Utc > b.Utc ? -1 : 1));
        S.rcm = [...msgs, ...S.rcm].slice(0, 60);
        renderRCM();
      }
      break;
  }
}

function timeClass(status) {
  const s = parseInt(status) || 0;
  if (s === 2064) return 'c-purple';
  if (s === 2051) return 'c-green';
  if (s === 2049) return 'c-yellow';
  if (s === 2048) return 'c-dim';
  return '';
}

function getQualInfo() {
  const name  = S.session.Name || '';
  const lower = name.toLowerCase();
  if (!lower.includes('qualifying')) return null;
  const sprint = lower.includes('sprint');
  if (lower.includes('1')) return { cutoff: 16, label: sprint ? 'SQ1' : 'Q1' };
  if (lower.includes('2')) return { cutoff: 11, label: sprint ? 'SQ2' : 'Q2' };
  if (lower.includes('3')) return { cutoff: 11, label: sprint ? 'SQ3' : 'Q3' };
  const total = Object.keys(S.timing).length;
  if (total > 15) return { cutoff: 16, label: 'Q1' };
  if (total > 10) return { cutoff: 11, label: 'Q2' };
  return { cutoff: 11, label: 'Q3' };
}

function renderTower() {
  const tbody = document.getElementById('tbody');
  if (!tbody) return;

  const rows = Object.entries(S.timing)
    .map(([num, t]) => ({ num, t, d: S.drivers[num] || {} }))
    .filter(r => r.t && r.t.Line != null)
    .sort((a, b) => (parseInt(a.t.Line) || 99) - (parseInt(b.t.Line) || 99));

  const qi = getQualInfo();
  let dividerInserted = false;

  let html = '';
  for (const { num, t, d } of rows) {
    const cs     = t._c && t._c.status != null ? t._c.status : null;
    const retired = cs ? cs === 'Retired' : !!t.Retired;
    const inPit   = cs ? cs === 'InPit'   : !!t.InPit;
    const pitOut  = cs ? cs === 'PitOut'  : !!t.PitOut;
    const pos     = t.ShowPosition === false ? '' : (t.Line || '');
    const tla     = d.Tla || num;
    const country = DRIVER_COUNTRY[tla] || '';

    /* Driver cell */
    const logoSrc = `src/timing-icons/driver-logo/Property 1=${tla}.svg`;
    const flagSrc = country ? `src/timing-icons/flags/Property 1=${country}.svg` : '';
    const driverCell = `<div class="drv-cell">
      <div class="drv-logo-bg"><img class="drv-logo" src="${logoSrc}" alt="${tla}" onerror="this.parentElement.style.display='none'"></div>
      <span class="drv-tla">${tla}</span>
      ${flagSrc ? `<img class="drv-flag" src="${flagSrc}" alt="${country}" onerror="this.style.display='none'">` : ''}
    </div>`;

    /* Status */
    let statusHTML = '';
    if (retired)    statusHTML = '<span class="status-badge status-dnf">DNF</span>';
    else if (inPit) statusHTML = '<span class="status-badge status-pit">IN PIT</span>';
    else if (pitOut)statusHTML = '<span class="status-badge status-out">PIT OUT</span>';

    /* Tyre */
    let tyreCell = '<span class="c-dim">—</span>';
    const app = S.appTiming[num];
    if (app && app.Stints) {
      const stints = Object.values(app.Stints);
      if (stints.length) {
        const last = stints[stints.length - 1];
        if (last.Compound) tyreCache[num] = last.Compound;
        const compound = (tyreCache[num] || 'null').toLowerCase();
        const age      = last.TotalLaps != null ? last.TotalLaps : '';
        tyreCell = `<div class="tyre-wrap">
          <img class="tyre-icon" src="src/timing-icons/tires/Property 1=${compound}.svg" alt="${compound}" onerror="this.style.display='none'">
          <span class="tyre-age">${age}</span>
        </div>`;
      }
    }

    /* Gap / Interval */
    const isFirst = parseInt(t.Line) === 1;
    const gapVal  = isFirst ? '<span class="c-dim">—</span>' : (t.GapToLeader || '—');
    const intObj   = t.IntervalToPositionAhead || {};
    const intVal   = intObj.Value || '—';
    const intFloat = parseFloat(intVal);
    let catching = (t._c && 'catching' in t._c) ? t._c.catching : !!intObj.Catching;
    if (!catching && !isNaN(intFloat)) {
      const prev = intCache[num];
      if (prev != null && intFloat < prev) catching = true;
    }
    if (!isNaN(intFloat)) intCache[num] = intFloat;
    const intCls = catching ? 'catching' : '';

    /* Sectors */
    const secs = t.Sectors || {};
    function secTD(i, colCls) {
      const s    = secs[String(i)] || {};
      const v    = s.Value || '';
      const prev = (s.PreviousValue && s.PreviousValue !== v) ? s.PreviousValue : '';
      const status = (t._c && t._c['s' + i] != null) ? t._c['s' + i] : s.Status;
      const cls  = v ? timeClass(status) : '';
      return `<td class="sec-cell ${colCls}"><div class="sec-wrap">
        <span class="sec-bar ${cls}"></span>
        <div class="sec-times">
          <span class="sec-mini">${prev}</span>
          <span class="sec-val ${cls}">${v || '—'}</span>
        </div>
      </div></td>`;
    }

    /* Lap times */
    const ll    = t.LastLapTime || {};
    const llStatus = (t._c && t._c.lap != null) ? t._c.lap : ll.Status;
    const llCls = ll.Value ? timeClass(llStatus) : 'c-dim';
    const bl    = t.BestLapTime || {};

    /* Elimination zone divider */
    const linePos = parseInt(t.Line) || 99;
    if (qi && qi.cutoff && !dividerInserted && linePos >= qi.cutoff) {
      html += `<tr class="elim-divider">
        <td colspan="11">
          <div class="elim-divider-inner">
            <img class="elim-chevron" src="src/timing-icons/chevrons-down.svg" width="14" height="14" alt="">
            <span class="elim-label">Elimination zone</span>
            <span class="elim-sep">—</span>
            <span class="elim-session">${qi.label}</span>
          </div>
        </td>
      </tr>`;
      dividerInserted = true;
    }

    const inElim = !!(qi && ((qi.cutoff && linePos >= qi.cutoff) || t.KnockedOut));

    html += `<tr class="${retired ? 'row-retired' : ''} ${inElim ? 'row-elim' : ''}">
      <td class="pos-cell l">${pos}</td>
      <td class="l">${driverCell}</td>
      <td class="status-col col-status">${statusHTML}</td>
      <td class="tyre-cell col-tyre">${tyreCell}</td>
      <td class="gap-cell">${gapVal}</td>
      <td class="int-cell col-int ${intCls}">${intVal}</td>
      ${secTD(0,'col-s1')}${secTD(1,'col-s2')}${secTD(2,'col-s3')}
      <td class="lap-cell ${llCls}">${ll.Value || '—'}<span class="best-mini">${bl.Value || '—'}</span></td>
      <td class="best-cell col-best">${bl.Value || '—'}</td>
    </tr>`;
  }

  tbody.innerHTML = html;
}

const TRACK_MAP = {
  '1': ['s-clear',  'CLEAR'],      '2': ['s-yellow', 'YELLOW'],
  '3': ['s-yellow', 'YELLOW'],     '4': ['s-sc',     'SAFETY CAR'],
  '5': ['s-red',    'RED FLAG'],   '6': ['s-vsc',    'VIRT SC'],
  '7': ['s-vsc',    'VSC END'],
};

function renderHeader() {
  const mtg = S.session.Meeting;
  document.getElementById('session-event').textContent = (mtg && mtg.Name) ? mtg.Name : '—';
  document.getElementById('session-type').textContent  = S.session.Name || '';

  const li = document.getElementById('lap-info');
  const isRace = !(S.session.Name || '').toLowerCase().includes('qualifying');
  if (isRace && S.lap.CurrentLap)
    li.textContent = S.lap.TotalLaps
      ? `Круг ${S.lap.CurrentLap} / ${S.lap.TotalLaps}`
      : `Круг ${S.lap.CurrentLap}`;
  else if (!isRace)
    li.textContent = '';

  const tb = document.getElementById('track-badge');
  const [cls, label] = TRACK_MAP[S.track.Status] || ['s-clear', S.track.Message || 'CLEAR'];
  tb.className  = cls;
  tb.textContent = label;
}

/* ── Translation ── */
let translateEnabled = false;
const translateCache = new Map();

async function translateText(text) {
  if (!text) return text;
  if (translateCache.has(text)) return translateCache.get(text);
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=${encodeURIComponent(text)}`;
    const r    = await fetch(url);
    const data = await r.json();
    const out  = data[0].map(i => i[0]).filter(Boolean).join('');
    translateCache.set(text, out);
    return out;
  } catch(_) { return text; }
}

async function translateVisibleRCM() {
  if (!translateEnabled) return;
  const els = document.querySelectorAll('.rcm-msg[data-orig]');
  for (const el of els) {
    if (el.dataset.done) continue;
    const translated = await translateText(el.dataset.orig);
    if (!translateEnabled) break;
    el.textContent  = translated;
    el.dataset.done = '1';
  }
}

function rcmIcon(flag) {
  const f = (flag || '').toUpperCase().replace(/\s+/g, '_');
  const fl = (color) =>
    `<svg width="11" height="13" viewBox="0 0 11 13" fill="none"><line x1="2" y1="0" x2="2" y2="13" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/><rect x="3" y="1" width="8" height="8" rx="0.5" fill="${color}"/></svg>`;
  if (f === 'YELLOW' || f === 'DOUBLE_YELLOW') return fl('#e0b800');
  if (f === 'RED')   return fl('#e03030');
  if (f === 'GREEN' || f === 'CLEAR') return fl('#4ade80');
  if (f === 'BLUE')  return fl('#5090f0');
  if (f === 'CHEQUERED') return `<svg width="11" height="13" viewBox="0 0 11 13" fill="none"><line x1="2" y1="0" x2="2" y2="13" stroke="#888" stroke-width="1.5" stroke-linecap="round"/><rect x="3" y="1" width="4" height="4" fill="#ccc"/><rect x="7" y="1" width="4" height="4" fill="#555"/><rect x="3" y="5" width="4" height="4" fill="#555"/><rect x="7" y="5" width="4" height="4" fill="#ccc"/></svg>`;
  if (f === 'SC')  return `<span class="rcm-badge" style="color:var(--orange);border-color:var(--orange)">SC</span>`;
  if (f === 'VSC') return `<span class="rcm-badge" style="color:var(--orange);border-color:var(--orange)">VSC</span>`;
  return '';
}

function renderRCM() {
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  const list = document.getElementById('rcm-list');
  list.innerHTML = S.rcm.map(m => {
    const ts   = (m.Utc || '').slice(11, 16);
    const flag = m.Flag ? `flag-${m.Flag.replace(/\s+/g, '-')}` : '';
    const text = m.Message || '';
    const icon = rcmIcon(m.Flag);
    return `<div class="rcm-row ${flag}">
      <span class="rcm-icon">${icon}</span>
      <span class="rcm-ts">${ts}</span>
      <span class="rcm-msg" data-orig="${esc(text)}">${text}</span>
    </div>`;
  }).join('');
  list.scrollTop = 0;
  if (translateEnabled) translateVisibleRCM();
}

function setDot(cls)           { document.getElementById('conn-dot').className = cls; }
function setPreloaderText(sub) { document.getElementById('pl-sub').textContent = sub; }
function hidePreloader()       { document.getElementById('preloader').classList.add('hidden'); }
function showStatus(msg)       { const b = document.getElementById('status-bar'); b.textContent = msg; b.classList.remove('hidden'); }
function clearStatus()         { document.getElementById('status-bar').classList.add('hidden'); }

document.getElementById('rcm-head').addEventListener('click', () => {
  const wrap = document.getElementById('rcm-wrap');
  const tog  = document.getElementById('rcm-toggle');
  const col  = wrap.classList.toggle('collapsed');
  tog.textContent = col ? '▸' : '▾';
});

document.getElementById('rcm-translate-btn').addEventListener('click', e => {
  e.stopPropagation();
  translateEnabled = !translateEnabled;
  document.getElementById('rcm-translate-btn').classList.toggle('active', translateEnabled);
  if (translateEnabled) {
    translateVisibleRCM();
  } else {
    document.querySelectorAll('.rcm-msg[data-orig]').forEach(el => {
      el.textContent = el.dataset.orig;
      delete el.dataset.done;
    });
  }
});
