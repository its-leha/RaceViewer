<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Live Timing</title>
  <style>
    :root {
      --bg:     #0d0d0d;
      --bg2:    #0a0a0a;
      --surf:   #111;
      --border: #232323;
      --text:   #c0c0c0;
      --dim:    #505050;
      --faint:  #2a2a2a;
      --green:  #2ec92e;
      --purple: #b060ff;
      --yellow: #e0b800;
      --red:    #e03030;
      --orange: #e08030;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      zoom: 1.2;
    }

    /* ── Session bar ── */
    #session-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      height: 34px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }
    #conn-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--faint);
      transition: background 0.3s;
    }
    #conn-dot.connected    { background: var(--green); }
    #conn-dot.connecting   { background: var(--yellow); animation: pulse 1s infinite; }
    #conn-dot.error        { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }

    #session-event {
      font-weight: 600;
      font-size: 12px;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    #session-type {
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #lap-info {
      font-size: 11px;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
    }
    #track-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 6px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #track-badge.s-clear  { background:#0d2010; color:var(--green); }
    #track-badge.s-yellow { background:#241d00; color:var(--yellow); }
    #track-badge.s-red    { background:#240000; color:var(--red); }
    #track-badge.s-sc     { background:#241000; color:var(--orange); }
    #track-badge.s-vsc    { background:#1a1000; color:var(--orange); }

    /* ── Timing tower ── */
    #tower-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #0f0f0f;
      z-index: 2;
      color: var(--dim);
      font-size: 9px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      padding: 4px 5px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      text-align: right;
      user-select: none;
    }
    thead th.l { text-align: left; }

    tbody tr { border-bottom: 1px solid #181818; }
    tbody tr:hover { background: #131313; }
    tbody tr.row-retired { opacity: 0.3; }

    td {
      padding: 5px 5px;
      white-space: nowrap;
      text-align: right;
      vertical-align: middle;
      color: var(--text);
    }
    td.l { text-align: left; }

    .pos-cell { color: var(--dim); font-size: 11px; width: 22px; }
    .num-cell { font-size: 11px; color: var(--dim); width: 26px; }

    .drv-cell { display: flex; align-items: center; gap: 5px; }
    .drv-bar  {
      width: 3px;
      height: 15px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .drv-tla {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: #d8d8d8;
    }
    .drv-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .drv-badge.pit  { color: var(--orange); }
    .drv-badge.out  { color: var(--green); }
    .drv-badge.stop { color: var(--red); }

    .gap-cell { min-width: 52px; }
    .int-cell { min-width: 48px; color: var(--dim); }
    .int-cell.catching { color: var(--green); }

    .sec-cell { min-width: 44px; }
    .lap-cell { min-width: 54px; }
    .best-cell { min-width: 54px; color: var(--dim); }

    .c-yellow { color: var(--yellow) !important; }
    .c-green  { color: var(--green)  !important; }
    .c-purple { color: var(--purple) !important; }
    .c-dim    { color: var(--dim)    !important; }

    /* Tyre */
    .tyre-cell { min-width: 36px; }
    .tyre-lbl  { font-weight: 700; font-size: 11px; }
    .tyre-age  { font-size: 10px; color: var(--dim); margin-left: 2px; }
    .tyre-S { color: #e04040; }
    .tyre-M { color: #d4b000; }
    .tyre-H { color: #d0d0d0; }
    .tyre-I { color: #44b844; }
    .tyre-W { color: #4488e0; }

    /* ── Race Control ── */
    #rcm-wrap {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--bg2);
      max-height: 110px;
      overflow-y: auto;
    }
    #rcm-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--dim);
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }
    #rcm-head:hover { color: var(--text); }
    #rcm-toggle { margin-left: auto; font-size: 10px; }
    #rcm-list { display: flex; flex-direction: column; }
    .rcm-row {
      display: flex;
      gap: 8px;
      padding: 4px 10px;
      border-bottom: 1px solid #141414;
      font-size: 11px;
    }
    .rcm-ts  { color: #383838; font-size: 10px; flex-shrink: 0; min-width: 38px; }
    .rcm-msg { flex: 1; color: var(--dim); line-height: 1.3; }
    .rcm-row.flag-YELLOW .rcm-msg { color: var(--yellow); }
    .rcm-row.flag-RED    .rcm-msg { color: var(--red); }
    .rcm-row.flag-GREEN  .rcm-msg { color: var(--green); }
    .rcm-row.flag-SC     .rcm-msg { color: var(--orange); }
    .rcm-row.flag-VSC    .rcm-msg { color: var(--orange); }
    #rcm-wrap.collapsed #rcm-list { display: none; }

    /* ── Status bar ── */
    #status-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 22px;
      background: #110000;
      border-top: 1px solid #200000;
      font-size: 10px;
      color: #904040;
    }
    #status-bar.hidden { display: none; }

    /* ── Preloader ── */
    #preloader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      z-index: 50;
    }
    #preloader.hidden { display: none; }
    .pl-dots { display: flex; gap: 8px; align-items: center; }
    .pl-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--dim);
      animation: dot-bounce 1.4s infinite ease-in-out both;
    }
    .pl-dots span:nth-child(1) { animation-delay: -0.32s; }
    .pl-dots span:nth-child(2) { animation-delay: -0.16s; }
    .pl-dots span:nth-child(3) { animation-delay:     0s; }
    @keyframes dot-bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40%           { transform: scale(1); opacity: 0.8; }
    }
    #pl-sub { font-size: 11px; color: var(--dim); }

    /* ── Narrow panel adjustments ── */
    @media (max-width: 520px) {
      .col-s1, .col-s2, .col-s3, .col-best { display: none; }
    }
    @media (max-width: 380px) {
      .col-int { display: none; }
      .num-cell { display: none; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Session bar -->
  <div id="session-bar">
    <span id="conn-dot" class="connecting"></span>
    <span id="session-event">—</span>
    <span id="track-badge" class="s-clear">CLEAR</span>
    <span id="session-type"></span>
    <span id="lap-info"></span>
  </div>

  <!-- Timing tower -->
  <div id="tower-wrap">
    <table>
      <thead>
        <tr>
          <th class="l">P</th>
          <th class="l">#</th>
          <th class="l">Водитель</th>
          <th>Гэп</th>
          <th class="col-int">Инт</th>
          <th class="col-s1 sec-cell">S1</th>
          <th class="col-s2 sec-cell">S2</th>
          <th class="col-s3 sec-cell">S3</th>
          <th>Круг</th>
          <th class="col-best">Лучший</th>
          <th>Рез</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Race Control messages -->
  <div id="rcm-wrap">
    <div id="rcm-head">
      <span>Race Control</span>
      <span id="rcm-toggle">▾</span>
    </div>
    <div id="rcm-list"></div>
  </div>

  <!-- Status bar (errors) -->
  <div id="status-bar" class="hidden"></div>

  <!-- Preloader -->
  <div id="preloader">
    <div class="pl-dots"><span></span><span></span><span></span></div>
    <span id="pl-sub">Подключение к F1 Live Timing…</span>
  </div>

</div>
<script>
'use strict';

const TOPICS = [
  'TimingData', 'DriverList', 'TimingAppData',
  'TrackStatus', 'LapCount', 'SessionInfo',
  'RaceControlMessages', 'ExtrapolatedClock',
];

/* ── State ── */
const S = {
  drivers:    {},
  timing:     {},
  appTiming:  {},
  session:    {},
  track:      { Status: '1', Message: 'AllClear' },
  lap:        {},
  rcm:        [],
};

/* ── Deep merge (F1 sends partial patch objects) ── */
function merge(tgt, src) {
  if (src === null || typeof src !== 'object' || Array.isArray(src)) return src;
  const out = Object.assign({}, tgt);
  for (const k of Object.keys(src)) {
    const sv = src[k], tv = out[k];
    if (sv !== null && typeof sv === 'object' && !Array.isArray(sv) &&
        tv !== null && typeof tv === 'object' && !Array.isArray(tv)) {
      out[k] = merge(tv, sv);
    } else {
      out[k] = sv;
    }
  }
  return out;
}

/* ── SignalR connection ── */
let ws = null, keepAlive = null, reconnTimer = null, msgI = 1;
let hasData = false, noSessionTimer = null, msgCount = 0;

async function connect() {
  setDot('connecting');
  clearTimeout(reconnTimer);
  clearStatus();
  if (ws) { try { ws.close(); } catch(_) {} ws = null; }

  if (!hasData) setPreloaderText('Подключение…');

  try {
    ws = new WebSocket('wss://updating-ambien-reprint-each.trycloudflare.com');
  } catch(e) {
    setDot('error');
    if (!hasData) setPreloaderText('Ошибка: ' + e.message);
    showStatus('Ошибка WebSocket · ' + e.message + ' · повтор через 2 с');
    reconnTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    setDot('connected');
    clearStatus();
    if (!hasData) {
      setPreloaderText('Ожидание данных сессии…');
      noSessionTimer = setTimeout(() => {
        if (!hasData) {
          if (msgCount === 0) {
            setPreloaderText('Нет данных от F1 · сессии нет или проблема с relay');
          } else {
            setPreloaderText(`Данные получены, но не распознаны · ${msgCount} сообщений`);
          }
        }
      }, 20000);
    }
    keepAlive = setInterval(() => ws.readyState === 1 && ws.send('{}'), 20000);
  };

  ws.onmessage = e => {
    msgCount++;
    try { handleMsg(JSON.parse(e.data)); } catch(_) {}
  };

  ws.onclose = e => {
    clearInterval(keepAlive);
    setDot('error');
    const detail = e.reason ? `${e.code} · ${e.reason}` : `код ${e.code}`;
    showStatus(`Соединение разорвано · ${detail} · повтор через 2 с`);
    if (!hasData) setPreloaderText('Соединение разорвано · повтор…');
    reconnTimer = setTimeout(connect, 2000);
  };

  ws.onerror = () => {};
}

function handleMsg(msg) {
  if (msg.__dbg) {
    if (!hasData) setPreloaderText(msg.__dbg);
    return;
  }
  if (msg.R && typeof msg.R === 'object') {
    for (const [topic, data] of Object.entries(msg.R)) applyFeed(topic, data);
  }
  if (Array.isArray(msg.M)) {
    for (const item of msg.M) {
      if (item.M === 'feed' && Array.isArray(item.A) && item.A.length >= 2)
        applyFeed(item.A[0], item.A[1]);
    }
  }
  if (msg.E) {
    showStatus('Ошибка SignalR · ' + msg.E);
    if (!hasData) setPreloaderText('Ошибка SignalR · ' + msg.E);
  }
}

function applyFeed(topic, data) {
  if (!data) return;
  switch (topic) {
    case 'DriverList':
      S.drivers = merge(S.drivers, data);
      if (Object.keys(S.drivers).length) { hasData = true; clearTimeout(noSessionTimer); hidePreloader(); clearStatus(); }
      renderTower();
      break;
    case 'TimingData':
      if (data.Lines) S.timing = merge(S.timing, data.Lines);
      if (Object.keys(S.timing).length) { hasData = true; clearTimeout(noSessionTimer); hidePreloader(); clearStatus(); }
      renderTower();
      break;
    case 'TimingAppData':
      if (data.Lines) S.appTiming = merge(S.appTiming, data.Lines);
      renderTower();
      break;
    case 'TrackStatus':
      S.track = Object.assign({}, S.track, data);
      renderHeader();
      break;
    case 'LapCount':
      S.lap = Object.assign({}, S.lap, data);
      renderHeader();
      break;
    case 'SessionInfo':
      S.session = merge(S.session, data);
      renderHeader();
      break;
    case 'RaceControlMessages':
      if (data.Messages) {
        const msgs = Object.values(data.Messages)
          .sort((a,b) => (a.Utc > b.Utc ? -1 : 1));
        S.rcm = [...msgs, ...S.rcm].slice(0, 60);
        renderRCM();
      }
      break;
    case 'ExtrapolatedClock':
      break;
  }
}

/* ── Sector / lap time color ── */
function timeClass(status) {
  const s = parseInt(status) || 0;
  if (s === 2064) return 'c-purple';
  if (s === 2051) return 'c-green';
  if (s === 2049) return 'c-yellow';
  if (s === 2048) return 'c-dim';
  return '';
}

/* ── Tyre ── */
const CSHORT = { SOFT:'S', MEDIUM:'M', HARD:'H', INTERMEDIATE:'I', WET:'W' };

function tyreHTML(num) {
  const app = S.appTiming[num];
  if (!app || !app.Stints) return '—';
  const stints = Object.values(app.Stints);
  if (!stints.length) return '—';
  const last  = stints[stints.length - 1];
  const c     = CSHORT[last.Compound] || '?';
  const age   = last.TotalLaps != null ? last.TotalLaps : '';
  return `<span class="tyre-lbl tyre-${c}">${c}</span><span class="tyre-age">${age}</span>`;
}

/* ── Render tower ── */
function renderTower() {
  const tbody = document.getElementById('tbody');
  if (!tbody) return;

  const rows = Object.entries(S.timing)
    .map(([num, t]) => ({ num, t, d: S.drivers[num] || {} }))
    .filter(r => r.t && r.t.Line != null)
    .sort((a, b) => (parseInt(a.t.Line) || 99) - (parseInt(b.t.Line) || 99));

  let html = '';
  for (const { num, t, d } of rows) {
    const retired  = !!t.Retired;
    const inPit    = !!t.InPit;
    const pitOut   = !!t.PitOut;

    const pos      = t.ShowPosition === false ? '' : (t.Line || '');
    const teamCol  = d.TeamColour ? '#' + d.TeamColour : '#444';
    const tla      = d.Tla || num;

    let badge = '';
    if (retired)    badge = '<span class="drv-badge stop">OUT</span>';
    else if (inPit) badge = '<span class="drv-badge pit">PIT</span>';
    else if (pitOut)badge = '<span class="drv-badge out">OUT</span>';

    const isFirst = parseInt(t.Line) === 1;
    const gapVal  = isFirst ? '<span class="c-dim">—</span>' : (t.GapToLeader || '—');

    const intObj  = t.IntervalToPositionAhead || {};
    const intVal  = intObj.Value || '—';
    const intCls  = intObj.Catching ? 'catching' : '';

    const secs = t.Sectors || {};
    function secTD(i, colCls) {
      const s = secs[String(i)] || {};
      const v = s.Value || '';
      return `<td class="${colCls} sec-cell ${v ? timeClass(s.Status) : 'c-dim'}">${v || '—'}</td>`;
    }

    const ll    = t.LastLapTime || {};
    const llVal = ll.Value || '—';
    const llCls = ll.Value ? timeClass(ll.Status) : 'c-dim';

    const bl    = t.BestLapTime || {};
    const blVal = bl.Value || '—';

    html += `<tr class="${retired ? 'row-retired' : ''}">
      <td class="pos-cell l">${pos}</td>
      <td class="num-cell l">${num}</td>
      <td class="l"><div class="drv-cell">
        <span class="drv-bar" style="background:${teamCol}"></span>
        <span class="drv-tla">${tla}</span>
        ${badge}
      </div></td>
      <td class="gap-cell">${gapVal}</td>
      <td class="int-cell col-int ${intCls}">${intVal}</td>
      ${secTD(0,'col-s1')}${secTD(1,'col-s2')}${secTD(2,'col-s3')}
      <td class="lap-cell ${llCls}">${llVal}</td>
      <td class="best-cell col-best">${blVal}</td>
      <td class="tyre-cell">${tyreHTML(num)}</td>
    </tr>`;
  }

  tbody.innerHTML = html;
}

/* ── Track status ── */
const TRACK_MAP = {
  '1': ['s-clear',  'CLEAR'],
  '2': ['s-yellow', 'YELLOW'],
  '3': ['s-yellow', 'YELLOW'],
  '4': ['s-sc',     'SAFETY CAR'],
  '5': ['s-red',    'RED FLAG'],
  '6': ['s-vsc',    'VIRT SC'],
  '7': ['s-vsc',    'VSC END'],
};

function renderHeader() {
  const ev = document.getElementById('session-event');
  const st = document.getElementById('session-type');
  const mtg = S.session.Meeting;
  ev.textContent = (mtg && mtg.Name) ? mtg.Name : '—';
  st.textContent = S.session.Name || '';

  const li = document.getElementById('lap-info');
  if (S.lap.CurrentLap) {
    li.textContent = S.lap.TotalLaps
      ? `Круг ${S.lap.CurrentLap} / ${S.lap.TotalLaps}`
      : `Круг ${S.lap.CurrentLap}`;
  }

  const tb = document.getElementById('track-badge');
  const [cls, label] = TRACK_MAP[S.track.Status] || ['s-clear', S.track.Message || 'CLEAR'];
  tb.className = cls;
  tb.textContent = label;
}

/* ── Race Control ── */
function renderRCM() {
  const list = document.getElementById('rcm-list');
  list.innerHTML = S.rcm.slice(0, 15).map(m => {
    const ts   = (m.Utc || '').slice(11, 16);
    const flag = m.Flag ? `flag-${m.Flag}` : '';
    return `<div class="rcm-row ${flag}">
      <span class="rcm-ts">${ts}</span>
      <span class="rcm-msg">${m.Message || ''}</span>
    </div>`;
  }).join('');
}

/* ── UI helpers ── */
function setDot(cls) {
  document.getElementById('conn-dot').className = cls;
}
function setPreloaderText(sub) {
  document.getElementById('pl-sub').textContent = sub;
}
function hidePreloader() {
  document.getElementById('preloader').classList.add('hidden');
}
function showStatus(msg) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.remove('hidden');
}
function clearStatus() {
  document.getElementById('status-bar').classList.add('hidden');
}

/* ── RCM collapse toggle ── */
document.getElementById('rcm-head').addEventListener('click', () => {
  const wrap = document.getElementById('rcm-wrap');
  const tog  = document.getElementById('rcm-toggle');
  const col  = wrap.classList.toggle('collapsed');
  tog.textContent = col ? '▸' : '▾';
});

connect();
</script>
</body>
</html>
