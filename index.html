<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceViewer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <span class="logo">RaceViewer</span>
            <div class="layout-selector">
                <button class="layout-btn" data-layout="2">2</button>
                <button class="layout-btn" data-layout="3">3</button>
                <button class="layout-btn" data-layout="4">4</button>
            </div>
            <div class="header-right">
                <button id="cal-btn" title="Календарь гонок">
                    <img src="src/icon/date.svg" alt="">
                </button>
                <button id="dock-btn" title="Виджеты">&#x229E;</button>
                <button id="hide-btn" title="Скрыть интерфейс (Ctrl+H)">&#x2922;</button>
            </div>
        </header>
        <div id="calendar-bar"><div id="cal-grid"></div></div>
        <div id="main-area">
            <main id="viewer"></main>
            <div id="dock-resizer" class="resizer h-res"></div>
            <aside id="dock">
                <div id="dock-bar">
                    <div id="dock-presets">
                        <button class="dock-preset" data-url="https://app.f1livepulse.com/live-timing">F1 Телеметрия</button>
                    </div>
                    <div class="dock-input-row">
                        <input id="dock-url-input" type="text" placeholder="URL сайта" autocomplete="off" spellcheck="false">
                        <button id="dock-go">Открыть</button>
                    </div>
                </div>
                <iframe id="dock-frame" src="about:blank" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
            </aside>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
