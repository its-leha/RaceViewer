<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceViewer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <span class="logo">RaceViewer</span>
            <div class="layout-selector">
                <button class="layout-btn" data-layout="2">2</button>
                <button class="layout-btn" data-layout="3">3</button>
                <button class="layout-btn" data-layout="4">4</button>
            </div>
            <button id="hide-btn" title="Скрыть интерфейс (Ctrl+H)">&#x2922;</button>
        </header>
        <main id="viewer"></main>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
